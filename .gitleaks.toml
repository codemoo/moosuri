# Exact encrypted bytes from the independently generated public synthetic v1 fixture.
# No credential/path-pattern blanket exception; changed values still trigger scanning.
[extend]
useDefault = true

[[allowlists]]
description = "Exact incomplete PEM marker used to reject unsafe installer paths; AAAA is not a private key"
condition = "AND"
paths = ['''(^|/)apps/moosuri/src/installation/kiri/tests\.rs$''']
regexTarget = "line"
regexes = ['''^\s*fs::write\(&key, b"-----BEGIN PRIVATE[ ]KEY-----\\nAAAA\\n"\)\.unwrap\(\);\s*$''']

[[allowlists]]
description = "Four fixed synthetic legacy-v1 wrap/nonce values; not operational credentials"
condition = "AND"
paths = ['''(^|/)crates/moosuri-vault-core/tests/fixtures/legacy-v1-webcrypto\.json$''']
regexTarget = "secret"
regexes = [
  '''^XL9lryHFn8MjTrFXhN6byDMxFSDDP\+cvEeBXuFdA76MwMUHrTnuYdGYpSHNiXPsj$''',
  '''^gIGCg4SFhoeIiYqL$''',
  '''^kJGSk5SVlpeYmZqb$''',
  '''^kq4d4xQ3ZP64K/UEmCF7ts9LJnuEUjSq4UOBzqwLom5OjbpemWytJ9GcJD8VGuyo$''',
]

# Public RSA SubjectPublicKeyInfo pins the installable Chrome extension ID.
[[allowlists]]
description = "Exact public Chrome extension identity key"
condition = "AND"
paths = ['''(^|/)deployment/browser/google-autofill/manifest\.json\.in$''']
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvO/1u83gvcBs3us6b3m/Fc0zVbVxObZ14ft1Iv2xcwI9nOgD/id1NqFZLL8cQvdM/KhRFLwWcrzNvDw5mNgLAeu2Al\+gOof\+sVOCO3Wzaiw8TWFMTa0DpYyWyO9bu5qzo1zK8uW7g7EFRCQGRW/bryU1oUs30NP/qADS\+pZytiA\+3hjGuX3AIGXpLP3u7REZsF3/oIJb9pgVMK2c6vZfQw9RrNi8zfR8OlBaF50HBydG5irLs9KiBomX0aRiy8iRWu11oSfdeKO5ZypgHDhJGiTFL0/ytHQLNFJ/fBPio0OTbWgGMuue77wm\+zvkIP36b36fVsANR57TNcuVet/\+hQIDAQAB$''']
