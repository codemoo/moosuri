[workspace]
members = [
  "tools/moosuri-eval",
  "crates/moosuri-credential-broker",
  "crates/moosuri-documents",
  "crates/moosuri-vault-wasm",
  "crates/moosuri-vault-service",
  "crates/moosuri-vault-protocol",
  "crates/moosuri-vault-core","tools/xtask", "crates/moosuri-core", "crates/moosuri-store", "crates/moosuri-server", "crates/moosuri-connectors", "crates/moosuri-agent", "apps/moosuri"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.23"
