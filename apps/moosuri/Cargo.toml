[package]
name = "moosuri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
test-fixtures = ["moosuri-connectors/test-fixtures", "moosuri-server/test-fixtures"]

[dependencies]
tempfile.workspace = true
moosuri-connectors = { path = "../../crates/moosuri-connectors" }
ring = "0.17"
sha2 = "0.10"
semver = "1"
png = "=0.18.1"
serde.workspace = true
uuid.workspace = true
zeroize = "1.8"
fs2 = "0.4"
base64 = "0.23"
moosuri-documents = { path = "../../crates/moosuri-documents" }
moosuri-core = { path = "../../crates/moosuri-core" }
moosuri-store = { path = "../../crates/moosuri-store" }
moosuri-server = { path = "../../crates/moosuri-server" }
moosuri-agent = { path = "../../crates/moosuri-agent" }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio.workspace = true
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.4"
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
url = "2.5"
libc = "0.2"

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls","json"] }
serde_json = { workspace = true, features = ["raw_value"] }
rustls-acme = { version = "=0.15.4", default-features = false, features = ["axum", "ring", "webpki-roots"] }
axum-server = { version = "=0.8.0", default-features = false }
futures-util = "0.3"
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "=0.3.7"

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "ring"] }
serde_json.workspace = true
