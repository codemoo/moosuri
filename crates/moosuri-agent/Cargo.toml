[package]
name = "moosuri-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
test-fixtures = ["moosuri-connectors/test-fixtures"]

[dependencies]
moosuri-core = { path = "../moosuri-core" }
moosuri-store = { path = "../moosuri-store" }
moosuri-connectors = { path = "../moosuri-connectors" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
moosuri-store = { path = "../moosuri-store", features = ["test-fixtures"] }
moosuri-connectors = { path = "../moosuri-connectors", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tempfile.workspace = true
futures-util = "0.3"

ring = "=0.17.14"
base64 = "0.23"
url = "2.5"
