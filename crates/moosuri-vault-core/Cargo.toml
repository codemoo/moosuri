[package]
name = "moosuri-vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["native-entropy"]
native-entropy = ["dep:rand"]

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
base64 = "=0.23.1"
data-encoding = "=2.11.1"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.26.1", default-features = false, features = ["serde", "std"] }
url = "=2.5.8"
rand = { version = "=0.8.8", default-features = false, features = ["getrandom"], optional = true }
