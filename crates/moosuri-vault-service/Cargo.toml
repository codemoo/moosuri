[package]
name = "moosuri-vault-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
moosuri-vault-protocol = { path = "../moosuri-vault-protocol" }
moosuri-vault-core = { path = "../moosuri-vault-core", default-features = false }
axum = { version = "0.8", features = ["http1", "json", "tokio", "form"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
sha2 = "=0.10.9"
zeroize = { version = "=1.9.1", features = ["alloc"] }
rand = "=0.8.8"
fs2 = "0.4"
age = { version = "=0.11.5", default-features = false }
libc = "0.2"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "backup"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
url = "=2.5.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
moosuri-vault-core = { path = "../moosuri-vault-core" }
moosuri-store = { path = "../moosuri-store" }
moosuri-server = { path = "../moosuri-server" }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
