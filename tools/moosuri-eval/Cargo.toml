[package]
name = "moosuri-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
moosuri-core = { path = "../../crates/moosuri-core" }
moosuri-store = { path = "../../crates/moosuri-store" }
moosuri-agent = { path = "../../crates/moosuri-agent" }
moosuri-server = { path = "../../crates/moosuri-server" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tempfile.workspace = true
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
